name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Universal Android APK (Release)
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uet-societies-hub-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest mobile/build/app/outputs/flutter-apk/app-release.apk \
            --title "UET Societies Hub (Latest Release)" \
            --notes "Automated release build with database relationship fixes, guest mode corrections, UI overflow fixes, and dummy test user (2025@uet.edu.pk)." \
            --latest
