name: uet_societies_hub
description: "UET Societies Hub - Official Student Societies Portal"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.0.1

  # Backend & Auth (Supabase Free Tier)
  supabase_flutter: ^2.5.4
  flutter_secure_storage: ^9.0.0

  # Push Notifications & Cloud Messaging (Firebase minSdk 21)
  firebase_core: ^2.30.0
  firebase_messaging: ^14.8.1

  # UI / UX & Utilities
  google_fonts: ^6.2.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
